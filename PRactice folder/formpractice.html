<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h2>Sign Up</h2>
     <p> Please fill in this form to create an account.</p>
    <form>
        <label for="username">Username:</form>
        <input type="text" placeholder="Username">
        <br><br>
        <label for="gender">Gender:</form>
        <input type="radio" name="Gender" value="male">Male
        
        <input type="radio" name="Gender" value="female">Female<br><br> 
        <label for="Date of Birth">Date of Birth:</form>
        <input type="DOB" placeholder="dd/mm/yyyy">
        <br><br>
        <label for="email">Email:</form>
        <input type="Email" placeholder="Enter your email">
        <br><br>
        <label for="Enter Your Password">Password:</form>
        <input type="password" placeholder="Password">
        <br><br>
        
        <input type="checkbox"> Remember me

        <a href="#">Forgot password?</a>
        <br><br>

        <input type="submit" value="Sign Up">
        <input type="reset" value="Cancel">

    </form>

</body>
</html>
